<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">PC checker read paths</title><desc id="d">Four hardware read paths feed a findings engine that emits one of four verdicts.</desc>
  <rect width="1200" height="800" fill="#14120f"/><rect x="70" y="70" width="1060" height="660" rx="12" fill="#1c1916" stroke="#514b43"/>
  <text x="110" y="128" fill="#f2efe8" font-family="Arial" font-size="28">Where every number comes from</text>
  <text x="110" y="160" fill="#8b8479" font-family="Arial" font-size="16">Four read paths, no vendor utility in the middle</text>

  <g font-family="Arial">
    <g fill="#25211c" stroke="#6fb6c4" stroke-width="2">
      <rect x="110" y="220" width="400" height="95" rx="8"/>
      <rect x="110" y="330" width="400" height="95" rx="8"/>
      <rect x="110" y="440" width="400" height="95" rx="8"/>
      <rect x="110" y="550" width="400" height="95" rx="8"/>
      <rect x="590" y="220" width="230" height="425" rx="8"/>
      <rect x="880" y="220" width="210" height="425" rx="8"/>
    </g>

    <g fill="#f2efe8" font-size="19">
      <text x="134" y="256">PawnIO kernel modules</text>
      <text x="134" y="366">Device IOCTLs</text>
      <text x="134" y="476">DXGI, then NVML and ADL</text>
      <text x="134" y="586">Windows Event Log</text>
    </g>
    <g fill="#8b8479" font-size="14">
      <text x="134" y="281">Signed driver, two signed modules</text>
      <text x="134" y="302">RAPL energy 0x611, APERF/MPERF, thermal status 0x1B1</text>
      <text x="134" y="391">SMART_RCV_DRIVE_DATA, then ATA_PASS_THROUGH</text>
      <text x="134" y="412">SMART attributes and the NVMe health log</text>
      <text x="134" y="501">DXGI enumerates adapters on any machine</text>
      <text x="134" y="522">Vendor libraries add clocks and throttle reasons</text>
      <text x="134" y="611">WHEA-Logger entries and unexpected shutdowns</text>
      <text x="134" y="632">Read through EvtQuery, not by parsing a log file</text>
    </g>

    <g text-anchor="middle">
      <text x="705" y="272" fill="#f2efe8" font-size="20">Findings engine</text>
      <g fill="#8b8479" font-size="14">
        <text x="705" y="320">One rule per reading.</text>
        <text x="705" y="344">A reading that failed is</text>
        <text x="705" y="368">reported as failed, never</text>
        <text x="705" y="392">flattened to a zero.</text>
        <text x="705" y="440">Nothing is averaged into</text>
        <text x="705" y="464">a single health score.</text>
      </g>
      <text x="985" y="272" fill="#f2efe8" font-size="20">Verdict</text>
    </g>

    <g fill="#25211c" stroke="#514b43"><rect x="905" y="320" width="160" height="46" rx="6"/><rect x="905" y="386" width="160" height="46" rx="6"/><rect x="905" y="452" width="160" height="46" rx="6"/><rect x="905" y="518" width="160" height="46" rx="6"/></g>
    <g fill="#f2efe8" font-size="17" text-anchor="middle"><text x="985" y="350">Ok</text><text x="985" y="416">Watch</text><text x="985" y="482">Problem</text><text x="985" y="548">Critical</text></g>
    <text x="985" y="606" fill="#8b8479" font-size="14" text-anchor="middle">Each one names the</text>
    <text x="985" y="628" fill="#8b8479" font-size="14" text-anchor="middle">register it came from</text>
  </g>

  <g stroke="#6fb6c4" stroke-width="3" fill="none"><path d="M510 268h64"/><path d="M510 378h64"/><path d="M510 488h64"/><path d="M510 598h64"/><path d="M820 433h44"/></g>
  <g fill="#6fb6c4"><path d="M590 268l-16-8v16z"/><path d="M590 378l-16-8v16z"/><path d="M590 488l-16-8v16z"/><path d="M590 598l-16-8v16z"/><path d="M880 433l-16-8v16z"/></g>

  <text x="110" y="694" fill="#6fb6c4" font-family="Arial" font-size="18">Rust · Tauri · PawnIO · Win32 IOCTL · DXGI · NVML · ADL · 11,346 lines</text>
</svg>
